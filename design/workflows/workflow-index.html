<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>LockStock Workflow Pictures</title>
    <style>
      :root {
        --ls-bg: #f4f0ea;
        --ls-surface: #fffdf9;
        --ls-surface-soft: #f8f5ef;
        --ls-text: #161412;
        --ls-muted: #6b6259;
        --ls-border: #111111;
        --ls-primary: #f26522;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        color: var(--ls-text);
        font-family: "Segoe UI", ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
        background:
          linear-gradient(rgba(17, 17, 17, 0.035) 1px, transparent 1px),
          linear-gradient(90deg, rgba(17, 17, 17, 0.035) 1px, transparent 1px),
          var(--ls-bg);
        background-size: 28px 28px;
      }
      main {
        max-width: 1280px;
        margin: 0 auto;
        padding: 28px 24px 64px;
      }
      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 18px;
        border: 2px solid var(--ls-border);
        background: var(--ls-surface);
        box-shadow: 8px 8px 0 rgba(17, 17, 17, 0.1);
        padding: 18px 20px;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 16px;
      }
      .mark {
        width: 60px;
        height: 40px;
        display: grid;
        gap: 8px;
      }
      .mark span {
        display: block;
        height: 8px;
        background: #111111;
      }
      .mark span:nth-child(2) {
        background: var(--ls-primary);
      }
      h1 {
        margin: 0;
        font-size: clamp(2rem, 4vw, 3.2rem);
        line-height: 0.95;
        letter-spacing: -0.06em;
      }
      p {
        margin: 6px 0 0;
        color: var(--ls-muted);
        font-weight: 600;
      }
      .tag {
        border: 2px solid var(--ls-border);
        background: var(--ls-primary);
        padding: 12px 16px;
        font-size: 0.72rem;
        font-weight: 900;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        white-space: nowrap;
      }
      section {
        margin-top: 28px;
        border: 2px solid var(--ls-border);
        background: var(--ls-surface);
        box-shadow: 8px 8px 0 rgba(17, 17, 17, 0.08);
      }
      h2 {
        margin: 0;
        border-bottom: 2px solid var(--ls-border);
        background: #111111;
        color: #ffffff;
        padding: 13px 18px;
        font-size: 0.78rem;
        font-weight: 900;
        letter-spacing: 0.1em;
        text-transform: uppercase;
      }
      img {
        display: block;
        width: 100%;
        height: auto;
        background: var(--ls-bg);
      }
      @media (max-width: 720px) {
        header {
          align-items: flex-start;
          flex-direction: column;
        }
        .tag {
          width: 100%;
          text-align: center;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <div class="brand">
          <div class="mark" aria-hidden="true"><span></span><span></span><span></span></div>
          <div>
            <h1>Workflow pictures</h1>
            <p>LockStock stock, purchasing, and group-management flows.</p>
          </div>
        </div>
        <div class="tag">Implementation map</div>
      </header>

      <section>
        <h2>Stock management overview</h2>
        <img src="stock-management-overview.svg" alt="Stock management workflow overview" />
      </section>

      <section>
        <h2>Stock movement workflow</h2>
        <img src="stock-movement-workflow.svg" alt="Stock movement workflow" />
      </section>

      <section>
        <h2>Purchase order lifecycle</h2>
        <img src="purchase-order-lifecycle.svg" alt="Purchase order lifecycle" />
      </section>

      <section>
        <h2>Members and groups workflow</h2>
        <img src="member-group-workflow.svg" alt="Members and groups workflow" />
      </section>
    </main>
  </body>
</html>
