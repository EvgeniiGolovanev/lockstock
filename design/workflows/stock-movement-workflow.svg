<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="980" viewBox="0 0 1440 980" role="img" aria-labelledby="title desc">
  <title id="title">LockStock stock movement workflow</title>
  <desc id="desc">Decision flow for stock movement reasons in the LockStock site style.</desc>
  <defs>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#111" stroke-opacity=".035"/></pattern>
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto" markerUnits="strokeWidth"><path d="M2 2L12 7L2 12Z" fill="#111"/></marker>
    <style>
      .bg{fill:#f4f0ea}.grid{fill:url(#grid)}.paper{fill:#fffdf9}.soft{fill:#f8f5ef}.cream{fill:#fff0e7}.orange{fill:#f26522}.red{fill:#bd2634}.green{fill:#ecf6ee}.ink{fill:#111}.frame,.box{stroke:#111;stroke-width:2;rx:0}.shadow{fill:#111;opacity:.1}.title{font:900 46px "Segoe UI",Arial,sans-serif;letter-spacing:-2px;fill:#161412}.sub{font:600 17px "Segoe UI",Arial,sans-serif;fill:#6b6259}.eyebrow{font:900 12px "Segoe UI",Arial,sans-serif;letter-spacing:1.4px;text-transform:uppercase;fill:#6b6259}.h{font:900 18px "Segoe UI",Arial,sans-serif;fill:#111}.t{font:600 13px "Segoe UI",Arial,sans-serif;fill:#4c453f}.tiny{font:900 11px "Segoe UI",Arial,sans-serif;letter-spacing:1px;text-transform:uppercase;fill:#111}.white{fill:#fff}.line{fill:none;stroke:#111;stroke-width:2.5;marker-end:url(#arrow)}.dash{fill:none;stroke:#111;stroke-width:2;stroke-dasharray:7 7;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect class="bg" width="1440" height="980"/><rect class="grid" width="1440" height="980"/>
  <g transform="translate(64 50)"><rect class="shadow" x="8" y="8" width="1312" height="110"/><rect class="frame paper" width="1312" height="110"/><text class="title" x="32" y="48">Stock movement</text><text class="sub" x="34" y="80">Choose the operational reason after active material and location checks pass.</text><rect class="orange frame" x="1120" y="30" width="142" height="42"/><text class="tiny" x="1149" y="56">Audit reason</text></g>
  <g transform="translate(548 196)"><rect class="shadow" x="8" y="8" width="344" height="84"/><rect class="box paper" width="344" height="84"/><rect class="ink" width="18" height="84"/><text class="h" x="40" y="34">Need to change stock</text><text class="t" x="40" y="58">Start a Stock Movement</text></g>
  <path class="line" d="M720 280V338"/>
  <g transform="translate(480 338)"><rect class="shadow" x="8" y="8" width="480" height="110"/><rect class="box soft" width="480" height="110"/><text class="eyebrow" x="28" y="34">Prerequisite gate</text><text class="h" x="28" y="65">Material and storage location must exist</text><text class="t" x="28" y="88">Both records must be active and not blocked.</text></g>
  <g transform="translate(1040 358)"><rect class="box red" width="278" height="72"/><text class="h white" x="24" y="31">Stop</text><text class="t white" x="24" y="54">Create or unblock records first</text></g>
  <path class="dash" d="M960 393H1028"/>
  <path class="line" d="M720 448V518"/>
  <g transform="translate(480 518)"><rect class="shadow" x="8" y="8" width="480" height="90"/><rect class="box paper" width="480" height="90"/><rect class="orange" width="480" height="16"/><text class="h" x="28" y="46">Why did the stock change?</text><text class="t" x="28" y="70">Select one permitted reason.</text></g>
  <g transform="translate(72 690)"><rect class="shadow" x="8" y="8" width="288" height="118"/><rect class="box green" width="288" height="118"/><text class="h" x="26" y="36">Adjustment</text><text class="t" x="26" y="62">Initial load, stock taking,</text><text class="t" x="26" y="84">document reconciliation, or</text><text class="t" x="26" y="106">technical correction.</text></g>
  <g transform="translate(408 690)"><rect class="shadow" x="8" y="8" width="288" height="118"/><rect class="box soft" width="288" height="118"/><text class="h" x="26" y="36">Consumption</text><text class="t" x="26" y="62">Material released to the</text><text class="t" x="26" y="84">construction team for work.</text></g>
  <g transform="translate(744 690)"><rect class="shadow" x="8" y="8" width="288" height="118"/><rect class="box soft" width="288" height="118"/><text class="h" x="26" y="36">Transfer</text><text class="t" x="26" y="62">Material moved from one</text><text class="t" x="26" y="84">storage location to another.</text></g>
  <g transform="translate(1080 690)"><rect class="shadow" x="8" y="8" width="288" height="118"/><rect class="box cream" width="288" height="118"/><text class="h" x="26" y="36">Receive PO</text><text class="t" x="26" y="62">Material bought via PO and</text><text class="t" x="26" y="84">received into storage.</text></g>
  <path class="line" d="M720 608C720 652 216 636 216 678"/><path class="line" d="M720 608C720 652 552 636 552 678"/><path class="line" d="M720 608C720 652 888 636 888 678"/><path class="line" d="M720 608C720 652 1224 636 1224 678"/>
  <g transform="translate(480 878)"><rect class="box orange" width="480" height="54"/><text class="h" x="28" y="34">Post movement and update balance</text></g>
</svg>
